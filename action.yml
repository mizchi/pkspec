name: Setup pkspec
description: Install the pkspec test runner (and its adapter shims) plus the Pkl CLI on the runner.
branding:
  icon: check-square
  color: blue

inputs:
  version:
    description: |
      pkspec release to install. Accepts the underlying release tag
      `pkspec@0.4.0`, the action-friendly form `v0.4.0`, a bare semver
      `0.4.0`, the floating major `v0`, or `latest`. When empty, the action
      reads its own ref (so pinning via `mizchi/pkspec@v0.4.0` or `@v0` just
      works) and falls back to the latest published release.
    required: false
    default: ""
  pkl-version:
    description: Pkl CLI version to install. Set to `none` to skip Pkl install.
    required: false
    default: "0.31.1"
  install-dir:
    description: Directory where binaries are placed. Added to GITHUB_PATH.
    required: false
    default: ${{ runner.temp }}/pkspec-bin
  init-schema-dir:
    description: Optional directory where `pkspec init --dir` writes Pkl schemas.
    required: false
    default: ""
  init-force:
    description: Pass `--force` when `init-schema-dir` is set.
    required: false
    default: "false"
  cache-pkl:
    description: |
      When `true`, cache `~/.pkl/cache` between runs via
      `actions/cache@v4`. Default `false` because local schemas avoid
      most remote Pkl package fetches.
    required: false
    default: "false"
  pkl-cache-key:
    description: |
      Override the cache key used when `cache-pkl: true`. Default is
      `pkl-<hashFiles('**/PklProject.deps.json', '**/*.pkl')>`.
    required: false
    default: ""
  github-token:
    description: GitHub token used for release lookup when version is `latest` or `v0`.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: Resolved pkspec release tag installed by the action.
    value: ${{ steps.resolve.outputs.version }}
  install-dir:
    description: Directory added to PATH.
    value: ${{ inputs.install-dir }}

runs:
  using: composite
  steps:
    - name: Resolve version and platform
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # GHA can't parse `uses: <repo>@pkspec@<ver>` (the second `@` in the
        # ref kills workflow file parsing). So the action ref is `v<ver>` or
        # `v<major>`; we normalize either form into the underlying release
        # tag `pkspec@<ver>` that the release assets live under.

        github_api() {
          local url="$1"
          if [ -n "${GH_TOKEN:-}" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          else
            curl -fsSL "$url"
          fi
        }

        latest() {
          github_api https://api.github.com/repos/mizchi/pkspec/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' \
            | head -n1
        }

        latest_major() {
          local major="$1"
          github_api https://api.github.com/repos/mizchi/pkspec/releases \
            | sed -n 's/.*"tag_name": *"\(pkspec@'"$major"'\.[^"]*\)".*/\1/p' \
            | head -n1
        }

        normalize() {
          local raw="$1"
          case "$raw" in
            "" | main | master) echo ""; return ;;
            latest) latest; return ;;
            pkspec@*) echo "$raw"; return ;;
            v[0-9]*.[0-9]*.[0-9]*) echo "pkspec@${raw#v}"; return ;;
            [0-9]*.[0-9]*.[0-9]*) echo "pkspec@$raw"; return ;;
            v[0-9]*) latest_major "${raw#v}"; return ;;
            *) echo "$raw"; return ;;
          esac
        }

        version="$(normalize "${{ inputs.version }}")"
        if [ -z "$version" ]; then
          version="$(normalize "${{ github.action_ref }}")"
        fi
        if [ -z "$version" ]; then
          version="$(latest)"
        fi
        if [ -z "$version" ]; then
          echo "::error::could not resolve a pkspec release tag (input/ref/latest all came up empty)"
          exit 1
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   plat=linux-amd64;  pkl_plat=linux-amd64 ;;
          Linux-ARM64) plat=linux-arm64;  pkl_plat=linux-aarch64 ;;
          macOS-ARM64) plat=darwin-arm64; pkl_plat=macos-aarch64 ;;
          macOS-X64)
            echo "::error::Intel macOS (darwin-amd64) is not supported — the MoonBit toolchain has no x86_64 macOS build. Use an Apple Silicon runner."
            exit 1
            ;;
          *)
            echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "plat=$plat" >> "$GITHUB_OUTPUT"
        echo "pkl_plat=$pkl_plat" >> "$GITHUB_OUTPUT"
        echo "::notice::installing pkspec $version ($plat)"

    - name: Install pkspec
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.install-dir }}"
        mkdir -p "$dir"
        # The tarball carries all six bare-named binaries (pkspec + 5 shims).
        url="https://github.com/mizchi/pkspec/releases/download/${{ steps.resolve.outputs.version }}/pkspec-${{ steps.resolve.outputs.plat }}.tar.gz"
        curl -fsSL "$url" | tar -xzf - -C "$dir"
        for bin in pkspec pkspec-adapter-vitest pkspec-adapter-playwright \
                   pkspec-adapter-node-test pkspec-adapter-go-test pkspec-adapter-moon-test; do
          chmod +x "$dir/$bin"
        done
        echo "$dir" >> "$GITHUB_PATH"

    - name: Install Pkl CLI
      if: inputs.pkl-version != 'none'
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.install-dir }}"
        mkdir -p "$dir"
        url="https://github.com/apple/pkl/releases/download/${{ inputs.pkl-version }}/pkl-${{ steps.resolve.outputs.pkl_plat }}"
        curl -fsSL -o "$dir/pkl" "$url"
        chmod +x "$dir/pkl"

    - name: Smoke-test
      shell: bash
      run: |
        set -euo pipefail
        export PATH="${{ inputs.install-dir }}:$PATH"
        pkspec version
        pkspec-adapter-go-test help >/dev/null
        if [ "${{ inputs.pkl-version }}" != "none" ]; then
          pkl --version
        fi
        if [ -n "${{ inputs.init-schema-dir }}" ]; then
          args=(init --dir "${{ inputs.init-schema-dir }}")
          if [ "${{ inputs.init-force }}" = "true" ]; then
            args+=(--force)
          fi
          pkspec "${args[@]}"
        fi

    - name: Cache ~/.pkl/cache
      if: inputs.cache-pkl == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.pkl/cache
        key: ${{ inputs.pkl-cache-key != '' && inputs.pkl-cache-key || format('pkl-{0}', hashFiles('**/PklProject.deps.json', '**/*.pkl')) }}
        restore-keys: pkl-
