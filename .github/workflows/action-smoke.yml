name: Action smoke

on:
  # The action downloads a published release tarball, so this can only run
  # once a pkspec@<ver> release exists. Manual/dispatch only — NOT on PR
  # (pre-release there is no tarball to fetch). Run it after cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test. Accepts v0.4.0 / 0.4.0 / v0 / pkspec@0.4.0. Empty = latest."
        required: false
        default: ""

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the action from this checkout
        uses: ./
        with:
          # On PR: empty → action falls back to "latest release".
          # On dispatch: whatever the user specified.
          version: ${{ inputs.version }}
          init-schema-dir: ${{ runner.temp }}/pkspec

      - name: Write smoke test
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Test.pkl" <<'EOF'
          amends "./pkspec/Test.pkl"

          tests {
            new {
              name = "action_smoke"
              body = new CmdTest {
                cmd = "printf 'hello from action\n'"
                inlineStdout = new InlineSnapshot { state = "match"; value = "hello from action\n" }
              }
            }
          }
          EOF

      - name: Run pkspec
        working-directory: ${{ runner.temp }}
        run: pkspec exec -f "$RUNNER_TEMP/Test.pkl"
