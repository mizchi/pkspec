name: govulncheck

on:
  schedule:
    # Weekly on Mondays 09:00 UTC (18:00 JST). Picks up newly disclosed
    # Go stdlib vulnerabilities even when no commits land in a quiet week.
    - cron: "0 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - ".github/workflows/govulncheck.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: scan reachable vulnerabilities
        run: govulncheck ./...
