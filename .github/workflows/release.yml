name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  nix:
    name: nix release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build
        run: nix build .#default --print-build-logs

      - name: Smoke release package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          got="$(./result/bin/pkspec version)"
          test "$got" = "$want"
          ./result/bin/pkspec help >/dev/null

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ./result/bin/pkspec init --dir "$tmp/pkspec"
          cat > "$tmp/Test.pkl" <<'PKL'
          amends "./pkspec/Test.pkl"

          tests {
            new {
              name = "nix_release_smoke"
              cmd = "true"
            }
          }
          PKL
          ./result/bin/pkspec exec -f "$tmp/Test.pkl"

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: nix
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
