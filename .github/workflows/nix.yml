name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `nix build .#default` fetches the prebuilt release tarball pinned in
  # nix/pkspec-release.json, so it can only run once a pkspec@<ver> release
  # exists with non-placeholder sha256. `nix flake check` evaluates every
  # output and builds the eval-only checks (native-pkl, home-manager-module)
  # which don't pull the pkspec tarball — that's the gate we keep on every PR.
  check:
    name: flake check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Pre-release the binary-fetch `packages.default` pins a placeholder
      # sha256 (filled by the first release), so a full `nix flake check`
      # (which builds derivations) can't pass. Validate the flake by EVAL
      # only — parses + evaluates every output, including the package's
      # version, without fetching the release tarball.
      - name: nix flake eval (no build pre-release)
        run: |
          nix --option access-tokens "github.com=${{ secrets.GITHUB_TOKEN }}" flake show
          nix --option access-tokens "github.com=${{ secrets.GITHUB_TOKEN }}" eval \
            ".#packages.$(nix eval --raw --impure --expr builtins.currentSystem).default.version"
