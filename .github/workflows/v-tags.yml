name: v-tags

# Keep action-friendly `v<ver>` + floating `v<major>` tags in sync with the
# canonical `pkspec@<ver>` release tags. Necessary because GitHub Actions
# cannot parse `uses: <repo>@<ref>` when the ref contains `@`, so workflow
# consumers need an `@`-free pinning shape.
#
# The job idempotently picks the highest `pkspec@*` tag, creates/updates the
# matching `v<ver>`, then bumps `v<major>` to the newest version inside that
# major. Safe to run any number of times.
#
# Triggers:
#   - workflow_run after a successful Release publish.
#   - workflow_dispatch — manual recovery if the workflow_run is missed.
#   - push to main whose changes touch THIS file — self-bootstraps the first
#     time the workflow lands.
#
# Implementation notes:
#
# 1. Uses git CLI directly rather than `gh api git/refs` — the latter returns
#    403 ("Resource not accessible by integration") from the
#    github-actions[bot] token even with explicit Contents:write.
#
# 2. Syncs ONLY the latest pkspec@<ver> tag (not a full backfill). GitHub's
#    pre-receive hook rejects bot pushes that "create or update workflow
#    files" — and GITHUB_TOKEN can never have the `workflows` scope. Only the
#    LATEST release tag is reachable on main with matching workflow files, so
#    its v-tags pass the hook; older releases must be back-tagged with a PAT.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v-tags.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # All tags so `git tag -l 'pkspec@*'` sees the full release history.
          fetch-depth: 0
      - name: Sync v<ver> + v<major> for the latest pkspec@* tag
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Pick the highest-version pkspec@* tag. `sort -V` handles semver
          # (so 0.10.0 > 0.4.0).
          latest=$(git tag -l 'pkspec@*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "no pkspec@* tags found — nothing to sync"
            exit 0
          fi
          v="${latest#pkspec@}"
          major="${v%%.*}"
          sha=$(git rev-list -n1 "$latest")
          echo "latest release: ${latest} → ${sha:0:12}"

          remote_sha_of() {
            git ls-remote origin "refs/tags/$1" 2>/dev/null | awk '{print $1}'
          }

          refspecs=()
          for ref in "v${v}" "v${major}"; do
            current=$(remote_sha_of "$ref")
            if [ "$current" = "$sha" ]; then
              echo "  ${ref} already at ${sha:0:12} (skip)"
              continue
            fi
            git tag -f "$ref" "$sha"
            if [ -z "$current" ]; then
              echo "  ${ref} will be created at ${sha:0:12}"
            else
              echo "  ${ref} will move ${current:0:12} → ${sha:0:12}"
            fi
            # `+` force-updates: required for floating v<major>.
            refspecs+=("+refs/tags/${ref}:refs/tags/${ref}")
          done

          if [ ${#refspecs[@]} -eq 0 ]; then
            echo "nothing to push"
            exit 0
          fi
          echo "pushing ${#refspecs[@]} ref(s)"
          git push origin "${refspecs[@]}"
